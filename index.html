<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForge AI Studio</title>
    <style>
        :root { --bg: #0a0a0c; --surface: #16161a; --surface2: #232329; --accent: #4f46e5; --text: #e2e8f0; --border: #2d2d35; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--surface); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .field { margin-bottom: 1.5rem; }
        input, textarea, select { width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: white; margin-top: 8px; box-sizing: border-box; }
        .btn-generate { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-2px); }
        .header { text-align: center; font-weight: bold; font-size: 1.5rem; margin-bottom: 20px; color: #818cf8; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">VoiceForge AI</div>

    <div class="field">
        <select id="voiceSelect"></select>
        <textarea id="textInput" rows="4" placeholder="Type script here..."></textarea>
    </div>
    
    <button class="btn-generate" onclick="generateAudio()">Generate Voice</button>
    
    <div id="audioArea" style="margin-top:20px; display:none;">
        <audio id="player" controls style="width:100%"></audio>
    </div>
</div>

<script>
    // 🎵 YAHAN APNI VOICES MANUALLY DAAL DE (Link aur Naam)
    const myVoices = [
        { name: "-- Select Voice --", url: "" },
        { name: "Cinematic Deep", url: "https://raw.githubusercontent.com/.../voice1.wav" },
        { name: "BGMI Pro", url: "https://raw.githubusercontent.com/.../voice2.wav" }
    ];

    // Website load hote hi voices dropdown mein daal do
    const select = document.getElementById('voiceSelect');
    myVoices.forEach(voice => {
        let opt = document.createElement('option');
        opt.value = voice.url;
        opt.innerText = voice.name;
        select.appendChild(opt);
    });

    // 🚀 ASLI ENGINE (Hugging Face Call)
    window.generateAudio = async () => {
        const text = document.getElementById('textInput').value;
        const voiceUrl = document.getElementById('voiceSelect').value;

        if(!text || !voiceUrl) return alert("Bhai, Script likh aur Voice select kar!");

        const btn = document.querySelector('.btn-generate');
        btn.innerText = "⏳ Generating Voice... Wait";

        try {
            const response = await fetch("https://namanrai-glowmation-tts-api.hf.space/run/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    data: [ text, voiceUrl ]
                })
            });

            if (!response.ok) throw new Error("Server Error: " + response.status);

            const result = await response.json();
            const audioData = result.data[0]; 
            
            const player = document.getElementById('player');
            document.getElementById('audioArea').style.display = 'block';
            
            if (typeof audioData === 'string') {
                player.src = audioData;
            } else if (audioData && audioData.name) {
                player.src = "https://namanrai-glowmation-tts-api.hf.space/file=" + audioData.name;
            } else if (audioData && audioData.url) {
                player.src = audioData.url;
            }
            
            player.play();
            btn.innerText = "Generate Voice";

        } catch (error) {
            console.error(error);
            alert("❌ Engine Fail Hua! Error: " + error.message);
            btn.innerText = "Generate Voice";
        }
    };
</script>
</body>
</html>
