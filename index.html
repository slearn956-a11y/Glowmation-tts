<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForge AI Studio</title>
    <style>
        :root { --bg: #0a0a0c; --surface: #16161a; --surface2: #232329; --accent: #4f46e5; --text: #e2e8f0; --muted: #94a3b8; --border: #2d2d35; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: var(--surface); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .field { margin-bottom: 1.5rem; }
        input, textarea, select { width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: white; margin-top: 8px; box-sizing: border-box; }
        .btn-generate { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-2px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #1e1b4b; color: #818cf8; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; border: 1px solid #3730a3; }
        #adminPanel { border: 1px solid #f59e0b; padding: 15px; border-radius: 15px; margin-bottom: 20px; display: none; background: rgba(245, 158, 11, 0.05); }
    </style>
</head>
<body>

<div id="authContainer" class="card">
    <h2 style="text-align:center; margin-bottom:1.5rem;">VoiceForge Login</h2>
    <div class="field">
        <input type="email" id="userEmail" placeholder="Email Address">
        <input type="password" id="userPass" placeholder="Password">
    </div>
    <button class="btn-generate" onclick="handleAuth('login')">Login</button>
    <button class="btn-generate" style="margin-top:10px; background:transparent; border:1px solid var(--accent);" onclick="handleAuth('signup')">Sign Up</button>
</div>

<div id="mainApp" class="card" style="display:none;">
    <div class="header">
        <div style="font-weight:bold; font-size:1.2rem;">VoiceForge AI</div>
        <div id="userCredits" class="badge">Credits: 0</div>
    </div>

    <div id="adminPanel">
        <div style="color:#f59e0b; font-size:0.8rem; font-weight:bold; margin-bottom:10px;">ADMIN PANEL // NAMAN</div>
        <input type="text" id="voiceName" placeholder="Voice Name (e.g. Cinematic Deep)">
        <input type="text" id="voiceUrl" placeholder="Audio File Ka Direct Link Yahan Daal">
        <button class="btn-generate" style="background:#f59e0b; color:black; margin-top:10px;" onclick="publishVoice()">Publish Voice</button>
    </div>

    <div class="field">
        <select id="voiceSelect"><option value="">Loading Voices...</option></select>
        <textarea id="textInput" rows="4" placeholder="Type script here..."></textarea>
    </div>
    <button class="btn-generate" onclick="generateAudio()">Generate (100 Credits)</button>
    <div id="audioArea" style="margin-top:20px; display:none;">
        <audio id="player" controls style="width:100%"></audio>
    </div>
    <button onclick="logout()" style="background:none; border:none; color:var(--muted); width:100%; margin-top:20px; cursor:pointer;">Logout</button>
</div>
